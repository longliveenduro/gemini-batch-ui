name: Tests

# Läuft bei jedem Push und Pull Request, auf Knopfdruck (Actions → Tests → Run workflow)
# und einmal pro Woche. Die Abhängigkeiten sind nicht festgepinnt (>=), der Wochenlauf meldet,
# wenn eine neue Version von Streamlit oder google-genai etwas bricht.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # montags, 05:17 UTC

permissions:
  contents: read

# Ein neuer Lauf für denselben Branch ersetzt den noch laufenden.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 ist die Mindestversion und zugleich die im Projekt genutzte Version (README, Abschnitt 3).
        python-version: ["3.12"]
    steps:
      - name: Code holen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt

      # Kein API-Key und kein Netzwerkzugriff nötig: Alle Google-Dienste sind in den Tests durch Fakes ersetzt.
      - name: Tests ausführen
        run: python -m pytest
